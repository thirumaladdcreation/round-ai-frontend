name: round_ai
description: "RoundsAI clinical workspace."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.0
  http_parser: ^4.1.2
  equatable: ^2.1.0
  flutter_bloc: ^9.1.1
  go_router: ^17.3.0
  shared_preferences: ^2.5.5
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  google_fonts: ^8.2.0
  package_info_plus: ^10.2.1
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.2
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  image_picker: ^1.2.3
  record: ^6.2.1
  image: ^4.12.0
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0

# permission_handler_android 14.1.x uses `kotlin { compilerOptions }` without
# applying the Kotlin Android plugin. That only works on AGP 9 built-in Kotlin;
# this app is on AGP 8.11.1, so pin the last Groovy build that compiles.
dependency_overrides:
  permission_handler_android: 13.0.1

flutter:
  uses-material-design: true
  assets:
    - config/env/
    - assets/images/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
